# Render Blueprint for AI Recruiter Assistant
# To deploy: Go to Render Dashboard -> Blueprints -> New Blueprint Instance -> Select your GitHub repository.

services:
  # Backend API Service (FastAPI)
  - type: web
    name: ai-recruiter-backend
    runtime: python
    plan: free
    rootDir: backend
    # Pre-fetch embedding weights at build time so the first request never downloads
    # them. Non-fatal: production still downloads on first use if this step fails.
    buildCommand: pip install -r requirements-prod.txt && (python scripts/download_models.py --skip-whisper --no-load-check || echo "WARNING - model pre-download failed; models will download on first use")
    startCommand: alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-recruiter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ai-recruiter-redis
          type: redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      # fromService has no `url` property (only host/port/hostport/...), and CORS needs
      # the full origin, so the frontend URL is set explicitly.
      - key: CORS_ORIGINS_STR
        value: "https://ai-recruiter-frontend.onrender.com"
      - key: TRUSTED_HOSTS_STR
        value: "localhost,127.0.0.1"
      - key: RUN_CV_WORKER_IN_API
        value: "true"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "270"
      - key: FIRST_USER_OWNER_ENABLED
        value: "true"
      - key: INITIAL_OWNER_EMAIL
        sync: false # Optional: set with INITIAL_OWNER_PASSWORD to create/promote a fixed admin account
      - key: INITIAL_OWNER_PASSWORD
        sync: false # Optional: must be at least 8 characters
      - key: EMBEDDING_PROVIDER
        value: "sentence-transformers"
      - key: LLM_PROVIDER
        value: "openai"
      - key: OPENAI_API_KEY
        sync: false # Set this in the Render Dashboard after deploying
      # Keep the HuggingFace cache inside the project dir so build-time downloads
      # are still there at runtime.
      - key: HF_HOME
        value: /opt/render/project/src/backend/.hf_cache
      # Render Free has 512 MB RAM: a second (multilingual, ~470 MB) model would OOM,
      # so Arabic text uses the standard model. Remove on a larger instance.
      - key: AUTO_DETECT_LANG
        value: "false"

  # Frontend Web Service (Vite + React + TS)
  - type: web
    name: ai-recruiter-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Must be a full URL: the client treats anything not starting with http as a path.
      - key: VITE_API_BASE_URL
        value: "https://ai-recuriter-yoy5.onrender.com/api/v1"
    routes:
      # SPA fallback: serve index.html for all client-side routes
      - type: rewrite
        source: /*
        destination: /index.html

  # Managed Redis for background tasks & rate limiting
  - type: redis
    name: ai-recruiter-redis
    plan: free
    ipAllowList: []

databases:
  # Managed PostgreSQL Database with pgvector support
  - name: ai-recruiter-db
    plan: free
