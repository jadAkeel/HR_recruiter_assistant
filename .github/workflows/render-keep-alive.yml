name: Keep Render Demo Warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-demo-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 10 \
            --max-time 90 \
            https://ai-recuriter-yoy5.onrender.com/api/v1/health
